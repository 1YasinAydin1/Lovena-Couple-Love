<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Lovena</title>
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<style>
@font-face {
  font-family: "Literata"; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("/assets/fonts/literata-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Literata"; font-style: normal; font-weight: 400 700; font-display: swap;
  src: url("/assets/fonts/literata-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Caveat"; font-style: normal; font-weight: 500 700; font-display: swap;
  src: url("/assets/fonts/caveat-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Caveat"; font-style: normal; font-weight: 500 700; font-display: swap;
  src: url("/assets/fonts/caveat-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

:root {
  color-scheme: light;
  --bg: #FAF8F7;
  --wash-1: #F5EACB;
  --wash-2: #FBE4E9;
  --wash-3: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F2EEEC;
  --text: #241F1D;
  --text-2: #4A413D;
  --muted: #7A6E69;
  --border: #E3DDDA;
  --rose: #B93356;
  --rose-bright: #D94467;
  --rose-soft: #FDF2F4;
  --rose-line: #F5C1CD;
  --gold: #D4A94A;
  --gold-soft: #FBF7EC;
  --headline-from: #B93356;
  --headline-to: #F4517B;
  --deep-from: #B93356;
  --deep-to: #932745;
  --on-deep: #FFFFFF;
  --note-paper: #FFE394;
  --note-ink: #37302D;
  --sky: #9CC7EA;
  --shadow: 0 1px 2px color-mix(in srgb, #241F1D 6%, transparent), 0 18px 40px -18px color-mix(in srgb, #6D1D34 30%, transparent);
  --shadow-soft: 0 1px 2px color-mix(in srgb, #241F1D 5%, transparent), 0 10px 24px -16px color-mix(in srgb, #241F1D 25%, transparent);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Literata", Georgia, "Times New Roman", serif;
  --font-script: "Caveat", "Segoe Print", cursive;
  --radius: 28px;
}
:lang(ja) { --font-sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif; }
:lang(ko) { --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
:lang(zh-Hant) { --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
:lang(ja), :lang(ko), :lang(zh-Hant) { --font-serif: var(--font-sans); --font-script: var(--font-sans); }

.tint-garden { --ink: #16A34A; --wash: #EFFAF3; }
.tint-notes { --ink: #E11D48; --wash: #FFF1F2; }
.tint-talk { --ink: #8B5CF6; --wash: #F3EEFF; }
.tint-games { --ink: #4F46E5; --wash: #EEF2FF; }
.tint-memories { --ink: #D94467; --wash: #FDF2F4; }
.tint-distance { --ink: #0284C7; --wash: #F0F9FF; }
.tint-widgets { --ink: #D4A94A; --wash: #FBF7EC; }
[class*="tint-"] { --ink-text: color-mix(in srgb, var(--ink) 55%, #241F1D); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
/* The app's own light screen behind every page: golden cream, warm rose,
   white (gradients.screen.light). Fixed to the viewport, as a phone screen is;
   a pseudo-element because iOS Safari ignores background-attachment: fixed. */
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, var(--wash-1) 0%, var(--wash-2) 45%, var(--wash-3) 100%); }
body {
  margin: 0; background: var(--wash-3); color: var(--text);
  font: 17px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden; overflow-wrap: break-word;
}
:lang(ja) body, :lang(ko) body, :lang(zh-Hant) body { line-height: 1.75; }
:lang(ko) body { word-break: keep-all; overflow-wrap: anywhere; }
img { max-width: 100%; height: auto; display: block; }
a { color: var(--rose); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--rose-bright); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.015em; margin: 0; color: var(--text); text-wrap: balance; }
:lang(ja) h1, :lang(ja) h2, :lang(ko) h1, :lang(ko) h2, :lang(zh-Hant) h1, :lang(zh-Hant) h2 { font-weight: 700; letter-spacing: 0; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 760px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 20; background: var(--surface); color: var(--text); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); }
.skip:focus { top: 12px; }

/* Header */
.site-head { position: relative; z-index: 10; }
.head-row { display: flex; align-items: center; gap: 16px; height: 72px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-family: var(--font-serif); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
:lang(ja) .brand, :lang(ko) .brand, :lang(zh-Hant) .brand { font-family: "Literata", Georgia, serif; }
.brand img { width: 34px; height: 34px; border-radius: 10px; box-shadow: var(--shadow-soft); }
.head-nav { display: none; margin-left: auto; gap: 28px; }
.head-nav a { color: var(--text-2); text-decoration: none; font-size: 15px; font-weight: 500; }
.head-nav a:hover { color: var(--rose); }
.lang-menu { position: relative; margin-left: auto; }
.head-nav + .lang-menu { margin-left: 8px; }
.lang-menu summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--text-2); font-size: 14px; font-weight: 500; }
.lang-menu summary::-webkit-details-marker { display: none; }
.lang-menu summary svg { width: 16px; height: 16px; }
.lang-menu[open] summary { border-color: var(--rose-line); color: var(--text); }
.lang-menu ul { position: absolute; right: 0; top: calc(100% + 8px); margin: 0; padding: 8px; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); min-width: 210px; }
.lang-menu li a { display: block; padding: 9px 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 15px; }
.lang-menu li a:hover { background: var(--surface-2); }
.lang-menu li a[aria-current] { background: var(--rose-soft); color: var(--rose); font-weight: 600; }
@media (min-width: 900px) { .head-nav { display: flex; } }

/* Hero */
.hero { position: relative; overflow: hidden; padding: 8px 0 72px; }
.home .site-head { background: transparent; }
.home .hero { margin-top: -72px; padding-top: 80px; }
.hero-grid { display: grid; gap: 40px; align-items: center; }
.eyebrow { font-family: var(--font-script); font-size: 28px; line-height: 1.1; color: var(--rose); font-weight: 600; margin-bottom: 10px; }
:lang(ja) .eyebrow, :lang(ko) .eyebrow, :lang(zh-Hant) .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; }
.display { font-size: clamp(38px, 9.5vw, 66px); line-height: 1.06; letter-spacing: -0.03em; }
:lang(ja) .display, :lang(ko) .display, :lang(zh-Hant) .display { font-size: clamp(32px, 8vw, 54px); line-height: 1.25; letter-spacing: 0; }
.accent { background: linear-gradient(90deg, var(--headline-from), var(--headline-to)); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: normal; }
.lead { margin-top: 18px; font-size: 18px; line-height: 1.6; color: var(--text-2); max-width: 34em; }
.trust { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; font-weight: 500; }
.trust li { display: inline-flex; align-items: center; gap: 7px; }
.trust svg { width: 14px; height: 14px; color: var(--rose-bright); }
.hero-visual { position: relative; display: flex; justify-content: center; padding: 10px 0 0; }
.hero-visual::before { content: ""; position: absolute; inset: 8% 6% 4%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--rose-bright) 22%, transparent), transparent); filter: blur(10px); }
.hero-shot { position: relative; width: min(72vw, 300px); }
.balloon { position: absolute; z-index: 2; width: 58px; pointer-events: none; }
.balloon.b1 { left: max(4px, calc(50% - 190px)); top: 2%; }
.balloon.b2 { right: max(4px, calc(50% - 186px)); top: 36%; width: 48px; }
@media (min-width: 900px) {
  .hero { padding-bottom: 104px; }
  .home .hero { padding-top: 104px; }
  .hero-grid { grid-template-columns: 1.1fr 0.9fr; gap: 56px; }
  .hero-shot { width: 340px; }
  .balloon { width: 96px; }
  .balloon.b1 { left: 0; top: 6%; }
  .balloon.b2 { right: 0; top: 34%; width: 76px; }
}

/* Store buttons */
.stores { margin-top: 28px; }
.store-row { display: flex; flex-wrap: wrap; gap: 12px; }
.store-btn { display: inline-flex; align-items: center; gap: 10px; min-width: 168px; padding: 10px 18px 10px 14px; border-radius: 16px; text-decoration: none; background: var(--text); color: var(--bg); border: 1px solid var(--text); line-height: 1.15; transition: transform .2s ease, box-shadow .2s ease; }
.store-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); text-decoration: none; }
.store-btn svg { width: 22px; height: 22px; flex: none; }
.store-btn small { display: block; font-size: 11px; opacity: .8; letter-spacing: .02em; }
.store-btn b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.stores.is-soon .store-btn { background: color-mix(in srgb, var(--surface) 75%, transparent); color: var(--text-2); border: 1px dashed var(--rose-line); cursor: default; }
.stores.is-soon .store-btn:hover { transform: none; box-shadow: none; }
.stores.is-soon .store-btn small { color: var(--rose); opacity: 1; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.soon-note { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.soon-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rose-bright); box-shadow: 0 0 0 4px color-mix(in srgb, var(--rose-bright) 22%, transparent); }
.on-deep .store-btn { background: var(--on-deep); color: #6D1D34; border-color: var(--on-deep); }
.on-deep .stores.is-soon .store-btn { background: color-mix(in srgb, var(--on-deep) 14%, transparent); color: var(--on-deep); border-color: color-mix(in srgb, var(--on-deep) 50%, transparent); }
.on-deep .stores.is-soon .store-btn small { color: var(--on-deep); }
.on-deep .soon-note { color: var(--on-deep); }
.on-deep .soon-note::before { background: var(--on-deep); box-shadow: 0 0 0 4px color-mix(in srgb, var(--on-deep) 25%, transparent); }

/* Phone shots: the store frames, caption cropped, on the brand's rose */
.shot { display: block; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: #E56E8A; aspect-ratio: 1320 / 2308; }
.shot img { width: 100%; height: 100%; object-fit: cover; }

/* Sections */
.section { padding: 72px 0; }
@media (min-width: 900px) { .section { padding: 112px 0; } }
.kicker { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--wash, var(--rose-soft)); color: var(--ink-text, var(--rose)); font-size: 13px; font-weight: 700; letter-spacing: .04em; margin-bottom: 18px; }
.kicker svg { width: 15px; height: 15px; }
.h2 { font-size: clamp(30px, 6.6vw, 46px); line-height: 1.12; letter-spacing: -0.025em; }
:lang(ja) .h2, :lang(ko) .h2, :lang(zh-Hant) .h2 { font-size: clamp(26px, 5.6vw, 38px); line-height: 1.35; letter-spacing: 0; }
.body { margin-top: 16px; font-size: 18px; color: var(--text-2); max-width: 32em; }
.points { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; }
.points li { display: flex; gap: 12px; align-items: flex-start; color: var(--text); font-size: 16px; font-weight: 500; }
.points svg { flex: none; width: 24px; height: 24px; padding: 4px; border-radius: 50%; background: var(--wash); color: var(--ink-text); margin-top: 1px; }
.section-head { text-align: center; max-width: 720px; margin: 0 auto 40px; }
.section-head .body { margin-left: auto; margin-right: auto; }

/* Garden window */
.garden-window { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--sky); }
.garden-window img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
@media (min-width: 641px) { .garden-window img { aspect-ratio: 1800 / 772; } }
.inside { padding-top: 0; padding-bottom: 0; }
.inside .garden-window { margin-top: -32px; }

/* Feature rows */
.feature-grid { display: grid; gap: 40px; align-items: center; }
.feature-visual { position: relative; margin: 0; display: flex; justify-content: center; }
.feature-visual::before { content: ""; position: absolute; width: min(92%, 440px); aspect-ratio: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--wash); }
.feature-visual .shot { position: relative; width: min(66vw, 270px); }
@media (min-width: 900px) {
  .feature-grid { grid-template-columns: 1fr 1fr; gap: 72px; }
  .feature-grid.reverse .feature-copy { order: 2; }
  .feature-visual .shot { width: 330px; }
}
.section.feature { padding: 48px 0; }
@media (min-width: 900px) { .section.feature { padding: 64px 0; } }
.inside + .feature { padding-top: 72px; }

/* A love note on the drawing */
.note { position: absolute; left: max(0px, calc(50% - 215px)); bottom: 10%; width: 172px; padding: 18px 16px 16px; border-radius: 6px 6px 18px 6px; background: var(--note-paper); color: var(--note-ink); font-family: var(--font-script); font-size: 27px; line-height: 1.1; font-weight: 600; transform: rotate(-5deg); box-shadow: var(--shadow); }
:lang(ja) .note, :lang(ko) .note, :lang(zh-Hant) .note { font-size: 18px; font-weight: 700; line-height: 1.4; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 54px; height: 18px; transform: translateX(-50%) rotate(3deg); background: color-mix(in srgb, #FFFFFF 55%, transparent); border-radius: 3px; }

/* Games */
.games-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .games-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) { .games-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
.game { display: flex; gap: 16px; align-items: flex-start; padding: 20px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-soft); }
.game-icon { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--g) 14%, var(--surface)); color: var(--g); }
.game-icon svg { width: 24px; height: 24px; }
.game h3 { font-family: var(--font-sans); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.game p { margin-top: 4px; color: var(--muted); font-size: 15px; line-height: 1.5; }

/* Privacy promise */
.promise { border-radius: 32px; padding: 40px 22px; background: var(--rose-soft); border: 1px solid var(--rose-line); }
@media (min-width: 900px) { .promise { padding: 64px; } }
.promise .kicker { background: var(--surface); }
.promise-grid { display: grid; gap: 14px; margin-top: 32px; }
@media (min-width: 640px) { .promise-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .promise-grid { grid-template-columns: repeat(4, 1fr); } }
.promise-item { background: var(--surface); border-radius: 22px; padding: 22px; box-shadow: var(--shadow-soft); }
.promise-item svg { width: 26px; height: 26px; color: var(--rose); }
.promise-item h3 { margin-top: 14px; font-family: var(--font-sans); font-size: 17px; font-weight: 700; }
.promise-item p { margin-top: 6px; color: var(--text-2); font-size: 15px; line-height: 1.55; }
.promise .more { margin-top: 28px; text-align: center; font-weight: 600; }

/* FAQ */
.faq-list { max-width: 780px; margin: 0 auto; display: grid; gap: 12px; }
.faq-list details { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 0 22px; box-shadow: var(--shadow-soft); }
.faq-list summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font-weight: 600; font-size: 17px; }
.faq-list summary::-webkit-details-marker { display: none; }
.faq-list summary::after { content: ""; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--rose-soft) no-repeat center / 12px 12px; background-image: linear-gradient(var(--rose), var(--rose)), linear-gradient(var(--rose), var(--rose)); background-size: 12px 2px, 2px 12px; transition: transform .25s ease; }
.faq-list details[open] summary::after { transform: rotate(45deg); }
.faq-list details p { padding: 0 0 22px; color: var(--text-2); font-size: 16px; }

/* Closing card */
.closing { position: relative; overflow: hidden; border-radius: 32px; padding: 56px 24px; text-align: center; color: var(--on-deep); background: linear-gradient(135deg, var(--deep-from), var(--deep-to)); }
.closing h2 { color: var(--on-deep); }
.closing .body { color: color-mix(in srgb, var(--on-deep) 88%, transparent); margin-left: auto; margin-right: auto; }
.closing .stores { display: flex; flex-direction: column; align-items: center; }
.closing .store-row { justify-content: center; }
.closing .balloon { opacity: .95; display: none; }
.closing .balloon.b1 { left: 4%; top: 12%; width: 56px; }
.closing .balloon.b2 { right: 5%; top: auto; bottom: 14%; width: 48px; }
@media (min-width: 900px) { .closing { padding: 80px 64px; } .closing .balloon { display: block; } .closing .balloon.b1 { width: 92px; left: 8%; } .closing .balloon.b2 { width: 76px; right: 9%; } }

/* Footer */
.site-foot { margin-top: 24px; padding: 56px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 15px; }
.foot-grid { display: grid; gap: 32px; }
@media (min-width: 760px) { .foot-grid { grid-template-columns: 1.4fr 1fr 1.6fr; } }
.site-foot h2 { font-family: var(--font-sans); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text); margin-bottom: 14px; }
:lang(ja) .site-foot h2, :lang(ko) .site-foot h2, :lang(zh-Hant) .site-foot h2 { letter-spacing: .02em; }
.site-foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.site-foot a { color: var(--text-2); text-decoration: none; }
.site-foot a:hover { color: var(--rose); text-decoration: underline; }
.site-foot .langs { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; }
.site-foot .langs a[aria-current] { color: var(--rose); font-weight: 600; }
.foot-brand p { margin-top: 12px; max-width: 22em; }
.foot-bottom { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; font-size: 14px; }

/* Long-form pages */
.doc-hero { padding: 24px 0 8px; }
.doc-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 28px; }

.doc-title { font-size: clamp(32px, 7vw, 46px); line-height: 1.15; letter-spacing: -0.025em; }

.updated { margin-top: 12px; color: var(--muted); font-size: 15px; }

.prose li::marker { color: var(--rose-bright); }

.doc-card { margin-top: 40px; padding: 24px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-soft); color: var(--text-2); }

/* Motion: gentle, and none for anyone who asked for less */
@media (prefers-reduced-motion: no-preference) {
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .hero-copy > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .hero-copy > :nth-child(2) { animation-delay: .06s; }
  .hero-copy > :nth-child(3) { animation-delay: .12s; }
  .hero-copy > :nth-child(4) { animation-delay: .18s; }
  .hero-copy > :nth-child(5) { animation-delay: .24s; }
  .hero-shot { animation: rise 1s .1s cubic-bezier(.2,.7,.2,1) both; }
  .balloon { animation: drift 7s ease-in-out infinite; }
  .balloon.b2 { animation-duration: 9s; animation-delay: -3s; }
}
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
